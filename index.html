<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>한영 생일 데이트 코스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- 메인 페이지 -->
  <div id="main-page" class="main-page">

    <!-- 배경 데코 -->
    <div class="main-deco-bg" aria-hidden="true">
      <span class="deco-asterisk" style="top:5%;left:6%;font-size:22px;">✱</span>
      <span class="deco-asterisk" style="top:8%;right:8%;font-size:14px;">✦</span>
      <span class="deco-asterisk" style="top:22%;right:5%;font-size:18px;">✱</span>
      <span class="deco-asterisk" style="top:48%;left:4%;font-size:12px;">✦</span>
      <span class="deco-asterisk" style="top:65%;right:6%;font-size:20px;">✱</span>
      <span class="deco-asterisk" style="top:80%;left:8%;font-size:14px;">✦</span>
      <span class="deco-circle-outline" style="width:30px;height:30px;top:14%;left:3%;"></span>
      <span class="deco-circle-outline" style="width:16px;height:16px;top:55%;right:3%;"></span>
      <span class="deco-leaf" style="top:30%;left:2%;font-size:22px;transform:rotate(-30deg);">🍃</span>
      <span class="deco-leaf" style="top:70%;right:2%;font-size:18px;transform:rotate(20deg);">🍃</span>
    </div>

    <!-- 헤더 -->
    <header class="main-header">
      <div class="header-title-card">
        <div class="header-date-tag">MAY 17</div>
        <h1 class="main-title">데이트 코스</h1>
        <p class="main-subtitle">5월 18일 생일 하루 미리 축하해! 🎂</p>
        <div class="destination-pill">
          <span class="pill-icon">📍</span>
          <span>목적지: 파주</span>
        </div>
      </div>
    </header>

    <!-- 코스 리스트 (JS 렌더링) -->
    <div id="course-list" class="course-list"></div>

    <div class="page-bottom-space"></div>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
